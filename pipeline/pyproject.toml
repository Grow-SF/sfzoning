[project]
name = "sfzmaps"
version = "0.1.0"
description = "Georeference historic San Francisco zoning maps"
authors = [
    { name = "Steven Bacio", email = "steven.buss@gmail.com" }
]
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.162.0",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.41.0",
    "pillow>=10",
    "opencv-python-headless>=5.0.0.93",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "shapely>=2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
sfzmaps = "sfzmaps.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "sfzmaps"

[tool.pytest.ini_options]
testpaths = ["tests"]
