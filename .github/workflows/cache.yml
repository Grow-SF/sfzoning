name: Cache shipped

# The merge gate for the versioned cache (pipeline/README.md, "Shipping the cache"): everything
# this commit needs to build at $0 — its answer packs, the answers its data was made from, and
# the data objects its dvc.lock names — is on the public Blob store, and dvc.lock matches the
# code (no commit added, or rebase, since the build). Public reads only: no secrets.
on:
  pull_request:
    paths:
      - "pipeline/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/cache.yml"

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shipped:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes exact tags only
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run python scripts/check_shipped.py
