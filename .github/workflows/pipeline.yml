name: Pipeline

# The pipeline's test suite, whenever a pull request or a push to main changes pipeline/ or
# the research table it reads. The tests use synthetic fixtures (no scans, no API key) but
# call GDAL's command-line tools, so they run in the official GDAL image; pmtiles and poppler
# are added on top. Tests that need the raw scans skip themselves.
on:
  pull_request:
    paths:
      - "pipeline/**"
      - "docs/research/**"
      - ".github/workflows/pipeline.yml"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "docs/research/**"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-3.13.3
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: System tools (git, poppler, pmtiles)
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl poppler-utils
          curl -fsSL https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin pmtiles
          gdalinfo --version && pmtiles version && pdftoppm -v
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes exact tags only
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
